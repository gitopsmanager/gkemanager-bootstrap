# The last step of a create (terraform/create-cluster/4-handover/README.md): the
# bootstrap pool goes, now that Config Connector runs the real pools. Started
# by the GUI's handover run (a plan run, after the core stack), whose earlier
# steps
#   1. wrote the cluster file's pools into the client's node pools file and
#      rendered them (the core-stack nodepools task, which waits until every
#      pool is RUNNING at its file's settings): Config Connector made them;
#   2. handed the node service account to Config Connector (cd-files.yml
#      adopt-cluster-identities, core-stack tools/cd_adopt.py). Its project
#      roles stay Terraform's: they are not on Config Connector's fixed list.
# This run checks that every pool but bootstrap is RUNNING, refuses otherwise,
# and runs 2-nodepools with runtime.bootstrap_pool false: Terraform deletes the
# pool, GKE drains its node, and its pods move to the new pools. Safe to run
# again: a pool already gone is nothing to do.
name: bootstrap-handover

run-name: "Handover ${{ inputs.cluster }} -- ${{ inputs.requested_by || github.actor }} [${{ inputs.plan_step }}]"

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "Cluster name: clusters/<cluster>.json"
        required: true
        type: string
      requested_by:
        description: "The GUI user, when the GUI starts it"
        type: string
        default: ""
      plan_step:
        description: "The GUI's plan step id, for matching this run (in the run name)"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write    # Workload Identity Federation

concurrency:
  group: create-cluster-${{ inputs.cluster }}
  cancel-in-progress: false

env:
  STATE_BUCKET: ${{ vars.CREATE_CLUSTER_STATE_BUCKET }}
  TFVARS: build/create-cluster/create.auto.tfvars.json

jobs:
  handover:
    runs-on: ${{ vars.CREATE_CLUSTER_RUNNER || 'gom-gcp-long' }}
    timeout-minutes: 60
    steps:
      - name: Check out this repo
        uses: actions/checkout@v7

      - name: The cluster file
        id: settings
        env:
          CLUSTER: ${{ inputs.cluster }}
        run: |
          set -euo pipefail
          [[ "$CLUSTER" =~ ^[a-z]([a-z0-9-]{0,38}[a-z0-9])?$ ]] || { echo "::error::Not a GKE cluster name: $CLUSTER"; exit 1; }
          [ -f "clusters/$CLUSTER.json" ] || { echo "::error::No clusters/$CLUSTER.json: only a cluster made by bootstrap-create-cluster.yml has a bootstrap pool"; exit 1; }
          command -v terraform >/dev/null && echo "terraform=true" >> "$GITHUB_OUTPUT" || echo "terraform=false" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Terraform
        # Pinned: must match the other Terraform runs.
        shell: bash
        run: bash scripts/install_terraform.sh 1.11.0

      # The create's variables, with the bootstrap pool switched off.
      - name: Settings
        id: prepare
        env:
          CLUSTER: ${{ inputs.cluster }}
          SECRETS_PROJECT: ${{ vars.SECRETS_PROJECT }}
          DNS_PROJECT: ${{ vars.DNS_PROJECT || vars.SECRETS_PROJECT }}
          CD_REPO: ${{ vars.CD_REPO }}
          COST_LABEL_NAME: ${{ vars.COST_LABEL_NAME }}
          COST_LABEL_VALUE: ${{ vars.COST_LABEL_VALUE }}
        run: |
          set -euo pipefail
          runtime=$(python3 -c 'import json, os; print(json.dumps({
            "secrets_project": os.environ["SECRETS_PROJECT"],
            "dns_project": os.environ["DNS_PROJECT"],
            "cd_repo_url": "https://github.com/" + os.environ["CD_REPO"] + ".git",
            "cost_label_name": os.environ.get("COST_LABEL_NAME", ""),
            "cost_label_value": os.environ.get("COST_LABEL_VALUE", ""),
            "bootstrap_pool": False,
          }))')
          python3 scripts/create_cluster.py prepare --cluster "$CLUSTER" --runtime "$runtime"

      - name: The operator's pools are running
        env:
          CLUSTER: ${{ inputs.cluster }}
          PROJECT: ${{ steps.prepare.outputs.project }}
          LOCATION: ${{ steps.prepare.outputs.location }}
        run: |
          set -euo pipefail
          gcloud container node-pools list --cluster "$CLUSTER" --project "$PROJECT" --location "$LOCATION" --format json > "$RUNNER_TEMP/pools.json"
          python3 - "$RUNNER_TEMP/pools.json" <<'PY'
          import json, sys
          pools = [p for p in json.load(open(sys.argv[1])) if p["name"] != "bootstrap"]
          for p in pools:
              print(f"{p['name']}: {p.get('status')}")
          if not pools:
              sys.exit("::error::No pool but bootstrap: the handover's node pools step has not made any")
          bad = [p["name"] for p in pools if p.get("status") != "RUNNING"]
          if bad:
              sys.exit(f"::error::Not running yet: {', '.join(bad)}. The bootstrap pool stays until every operator pool runs.")
          PY

      - name: The bootstrap pool goes
        run: bash scripts/run_terraform_stage.sh 2-nodepools "${{ steps.prepare.outputs.project }}" "${{ inputs.cluster }}" "$STATE_BUCKET" apply "$TFVARS"

      - name: Stop Terraform gracefully
        if: cancelled()
        timeout-minutes: 45
        run: bash scripts/run_terraform_stage.sh --stop
