# Create one GKE cluster from clusters/<cluster>.json, with Terraform. The GKE
# counterpart of eksmanager-bootstrap's bootstrap-create-cluster.yml.
#
#   validate the cluster file
#   -> 1-cluster (the cluster, its node service account)
#   -> identity-cnrm (Config Connector's own identity, terraform/cluster-identities/cnrm;
#      also run on its own by bootstrap-cluster-identities.yml)
#   -> 2-nodepools (the bootstrap pool only)
#   -> 3-platform (namespaces, the Argo CD admin password, Workload Identity
#      grants, Argo CD)
#   -> record it (clusters/<cluster>.outputs.json)
#
# Then install the core stack on it with core-stack's install-core-stack.yml,
# with install_node_pool_operator on. The cluster file's pools come after
# that, from the CD repo through Config Connector; the bootstrap pool then
# goes (terraform/create-cluster/4-handover/README.md, not built yet).
#
# Safe to re-run: each stage is its own state, and a stage that is up to date
# plans no changes. Two runs for the same cluster queue rather than race.
#
# Runs on GitOps Manager's long-job runner on Google Cloud (label gom-gcp-long:
# a Cloud Run job execution, core-stack's terraform/runners-gcp) as that runner's
# service account, which may create clusters in the cluster's project and
# write secrets and IAM in the shared services project (the module's
# role_bindings). The control plane is reached through its DNS-based endpoint,
# which IAM guards. Elsewhere (e.g. GitHub's runners: CREATE_CLUSTER_RUNNER),
# it signs in through Workload Identity Federation instead.
#
# Repository variables:
#   CREATE_CLUSTER_RUNNER           optional: runs-on (default gom-gcp-long)
#   GCP_WORKLOAD_IDENTITY_PROVIDER  optional: projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>,
#                                   to sign in through Workload Identity Federation rather than as the runner
#   GCP_SERVICE_ACCOUNT             with it: the service account the run acts as
#   CREATE_CLUSTER_STATE_BUCKET     the GCS bucket for the stages' state
#   SECRETS_PROJECT                 the shared services project (Secret Manager)
#   DNS_PROJECT                     optional: the Cloud DNS zone's project (default SECRETS_PROJECT)
#   GOM_APP_CLIENT_ID               the GitHub App that commits the record (secret
#                                   GOM_APP_PRIVATE_KEY); required
#   CD_REPO                         owner/name of the CD repo
#   CORE_STACK_REF                  the core-stack tag or commit Argo CD comes from
#   CORE_STACK_REPO                 optional: owner/name of the core-stack repo (default
#                                   gitopsmanager/core-stack, public); a private one is read
#                                   as the GitHub App (GOM_APP_CLIENT_ID, secret
#                                   GOM_APP_PRIVATE_KEY)
#   TERRAFORM_VERSION                    optional: Terraform, when the runner has none (default 1.11.0)
#   COST_LABEL_NAME, COST_LABEL_VALUE  optional: a cost label on everything
name: bootstrap-create-cluster

run-name: "Create GKE cluster ${{ inputs.cluster }}${{ inputs.dry_run && ' (plan only)' || '' }} -- ${{ inputs.requested_by || github.actor }}"

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "Cluster name: clusters/<cluster>.json"
        required: true
        type: string
      dry_run:
        description: "Validate the file and plan 1-cluster only; change nothing"
        type: boolean
        default: false
      requested_by:
        description: "The GUI user, when the GUI starts it"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write    # Workload Identity Federation

concurrency:
  group: create-cluster-${{ inputs.cluster }}
  cancel-in-progress: false

env:
  STATE_BUCKET: ${{ vars.CREATE_CLUSTER_STATE_BUCKET }}
  TFVARS: build/create-cluster/create.auto.tfvars.json

jobs:
  create:
    runs-on: ${{ vars.CREATE_CLUSTER_RUNNER || 'gom-gcp-long' }}
    timeout-minutes: 110
    steps:
      - name: Check out this repo
        uses: actions/checkout@v7

      # The record at the end is committed as the GitHub App: fail now, not after
      # the run has done its work.
      - name: Check the GitHub App
        if: ${{ !inputs.dry_run }}
        env:
          APP_ID: ${{ vars.GOM_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.GOM_APP_PRIVATE_KEY }}
        run: |
          [ -n "$APP_ID" ] && [ -n "$APP_KEY" ] || { echo "::error::The GitHub App is required: repository variable GOM_APP_CLIENT_ID and secret GOM_APP_PRIVATE_KEY"; exit 1; }

      - name: Token for the core-stack repo
        id: core_stack_app
        if: ${{ vars.CORE_STACK_REPO != '' && vars.CORE_STACK_REPO != 'gitopsmanager/core-stack' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GOM_APP_CLIENT_ID }}
          private-key: ${{ secrets.GOM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check out core-stack (Argo CD's chart)
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.CORE_STACK_REPO || 'gitopsmanager/core-stack' }}
          ref: ${{ vars.CORE_STACK_REF }}
          path: core-stack
          token: ${{ steps.core_stack_app.outputs.token || github.token }}
          persist-credentials: false

      - name: Check the settings
        id: settings
        env:
          WIP: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
          BUCKET: ${{ vars.CREATE_CLUSTER_STATE_BUCKET }}
          SECRETS_PROJECT: ${{ vars.SECRETS_PROJECT }}
          CD_REPO: ${{ vars.CD_REPO }}
          CORE_STACK_REF: ${{ vars.CORE_STACK_REF }}
        run: |
          for v in BUCKET SECRETS_PROJECT CD_REPO CORE_STACK_REF; do
            [ -n "${!v:-}" ] || { echo "::error::Repository variable for $v is not set (see the top of this workflow)"; exit 1; }
          done
          if [ -n "$WIP" ] && [ -z "$SA" ]; then echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER needs GCP_SERVICE_ACCOUNT"; exit 1; fi
          # The runner image has Terraform; GitHub's runners don't.
          command -v terraform >/dev/null && echo "terraform=true" >> "$GITHUB_OUTPUT" || echo "terraform=false" >> "$GITHUB_OUTPUT"

      # Elsewhere than our runner: Workload Identity Federation. On it, the
      # runner's service account (gcloud reads it from the metadata server).
      - uses: google-github-actions/auth@v3
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Terraform
        # Pinned: must match the other Terraform runs.
        shell: bash
        run: bash scripts/install_terraform.sh 1.11.0

      - name: Tools
        run: |
          set -euo pipefail
          # gcloud, kubectl, helm and the GKE sign-in plugin are in the runner
          # image; on GitHub's runners the plugin comes from Google's apt
          # repository.
          command -v gke-gcloud-auth-plugin >/dev/null || sudo apt-get install -y -qq google-cloud-cli-gke-gcloud-auth-plugin >/dev/null
          terraform version
          gcloud --version | head -1
          helm version --short
          python3 --version

      - name: Validate the cluster file
        id: prepare
        env:
          CLUSTER: ${{ inputs.cluster }}
          SECRETS_PROJECT: ${{ vars.SECRETS_PROJECT }}
          DNS_PROJECT: ${{ vars.DNS_PROJECT || vars.SECRETS_PROJECT }}
          CD_REPO: ${{ vars.CD_REPO }}
          COST_LABEL_NAME: ${{ vars.COST_LABEL_NAME }}
          COST_LABEL_VALUE: ${{ vars.COST_LABEL_VALUE }}
        run: |
          set -euo pipefail
          runtime=$(python3 -c 'import json, os; print(json.dumps({
            "secrets_project": os.environ["SECRETS_PROJECT"],
            "dns_project": os.environ["DNS_PROJECT"],
            "cd_repo_url": "https://github.com/" + os.environ["CD_REPO"] + ".git",
            "core_stack_dir": os.path.abspath("core-stack"),
            "cost_label_name": os.environ.get("COST_LABEL_NAME", ""),
            "cost_label_value": os.environ.get("COST_LABEL_VALUE", ""),
          }))')
          python3 scripts/create_cluster.py prepare --cluster "$CLUSTER" --runtime "$runtime"

      - name: Argo CD chart dependencies
        run: helm dependency build core-stack/components/argo-cd

      - name: 1-cluster
        run: bash scripts/run_terraform_stage.sh 1-cluster "${{ steps.prepare.outputs.project }}" "${{ inputs.cluster }}" "$STATE_BUCKET" "${{ inputs.dry_run && 'plan' || 'apply' }}" "$TFVARS"

      # Config Connector's identity: its own state, and never deleted or
      # replaced by a run (NO_DESTROY).
      - name: identity-cnrm
        if: ${{ !inputs.dry_run }}
        env:
          STAGE_DIR: terraform/cluster-identities/cnrm
          NO_DESTROY: "1"
        run: bash scripts/run_terraform_stage.sh identity-cnrm "${{ steps.prepare.outputs.project }}" "${{ inputs.cluster }}" "$STATE_BUCKET" apply "$TFVARS"

      - name: 2-nodepools
        if: ${{ !inputs.dry_run }}
        run: bash scripts/run_terraform_stage.sh 2-nodepools "${{ steps.prepare.outputs.project }}" "${{ inputs.cluster }}" "$STATE_BUCKET" apply "$TFVARS"

      - name: 3-platform
        if: ${{ !inputs.dry_run }}
        run: bash scripts/run_terraform_stage.sh 3-platform "${{ steps.prepare.outputs.project }}" "${{ inputs.cluster }}" "$STATE_BUCKET" apply "$TFVARS"

      - name: Record the cluster
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          python3 scripts/create_cluster.py register --cluster "${{ inputs.cluster }}" \
            --terraform-outputs build/create-cluster/1-cluster.outputs.json
          echo "Created ${{ inputs.cluster }}. Next: core-stack's install-core-stack.yml with stacks/${{ inputs.cluster }}.json." >> "$GITHUB_STEP_SUMMARY"

      # Made here, not earlier: an App token lasts an hour.
      - name: Token for this repo
        id: record_app
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GOM_APP_CLIENT_ID }}
          private-key: ${{ secrets.GOM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # Through a pull request squash-merged with retries
      # (gitopsmanager/Auto-Commit-Squash-Merge): another run's record is
      # merged with, never overwritten. As the GitHub App.
      - name: Commit the cluster record
        if: ${{ !inputs.dry_run }}
        uses: gitopsmanager/Auto-Commit-Squash-Merge@v2
        with:
          token: ${{ steps.record_app.outputs.token }}
          repo_owner: ${{ github.repository_owner }}
          repo_name: ${{ github.event.repository.name }}
          path: .
          repo_path_rel: clusters
          cluster: ${{ inputs.cluster }}
          skip_if_unchanged: "true"
          push_auth: token
          commit_message: "Created GKE cluster ${{ inputs.cluster }} (run ${{ github.run_id }})"

      # After a cancel (GitHub's Cancel button; the GUI offers none for a
      # create): Terraform runs apart from the stage steps and has been asked to
      # stop gracefully; this waits for it, and removes a lock this runner left
      # only if Terraform died holding it (scripts/run_terraform_stage.sh).
      - name: Stop Terraform gracefully
        if: cancelled()
        timeout-minutes: 45
        run: bash scripts/run_terraform_stage.sh --stop
